name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (Node 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
      - name: Run focused tests
        run: pnpm test
      - name: Check product film asset budgets
        run: pnpm test:media
      - name: Check Astro templates and content
        run: pnpm check
      - name: Refresh public GitHub activity for the deployment artifact
        # Validate the checked-in baseline first; refresh only the build workspace.
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.BASECHILDREN_GITHUB_ACTIVITY_TOKEN || github.token }}
          GITHUB_ACTIVITY_EXPECTED_VIEWER: ${{ secrets.BASECHILDREN_GITHUB_ACTIVITY_TOKEN != '' && 'basechildren' || '' }}
        run: node scripts/refresh-github-activity.mjs
      - name: Require the production analytics key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
        run: '[[ "$PUBLIC_POSTHOG_KEY" =~ ^phc_[A-Za-z0-9_-]{8,128}$ ]]'
      - name: Build production site
        run: pnpm build
        env:
          PUBLIC_POSTHOG_KEY: >-
            ${{ github.ref == 'refs/heads/main' &&
                secrets.PUBLIC_POSTHOG_KEY ||
                'phc_ci_build_only' }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST || 'https://us.i.posthog.com' }}
      - name: Check generated public routes and evidence content
        run: pnpm test:site
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Check public assets for private data
        run: pnpm privacy:check
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the verified Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
