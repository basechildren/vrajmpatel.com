name: Verify and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.24.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        if: matrix.node == 24
        run: pnpm audit --prod --audit-level=high
      - name: Test analytics privacy boundary
        run: pnpm test
      - name: Check Astro templates and content
        run: pnpm check
      - name: Require a public production analytics key
        if: >-
          matrix.node == 24 &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
        run: '[[ "$PUBLIC_POSTHOG_KEY" =~ ^phc_[A-Za-z0-9_-]{8,128}$ ]]'
      - name: Build site
        run: pnpm build
        env:
          PUBLIC_POSTHOG_KEY: >-
            ${{ github.ref == 'refs/heads/main' &&
                secrets.PUBLIC_POSTHOG_KEY ||
                'phc_ci_build_only' }}
          PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      - name: Install PDF inspection tools
        if: matrix.node == 24
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Check the public privacy boundary
        if: matrix.node == 24
        run: pnpm privacy:check
      - name: Upload the verified Pages artifact
        if: >-
          matrix.node == 24 &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy verified artifact
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
