name: Merge verified PostHog updates

on:
  workflow_run:
    workflows: ["Verify and deploy"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-verified-update:
    name: Merge verified PostHog update
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install trusted validation dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate, squash merge, and request main verification
        run: node scripts/posthog-dependabot.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
